[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lyricsync-client"
version = "0.1.0"
description = "HTTP client for LyricSync"
requires-python = ">=3.10"
license = { text = "UNLICENSED" }
keywords = ["lyricsync", "lyrics", "amll"]

[tool.setuptools]
py-modules = ["lyricsync_client"]
